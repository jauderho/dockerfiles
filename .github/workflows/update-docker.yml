# updatebot
#
# This runs every hour to check if upstream repos have had a new release.
# Once a day (the "30 3 * * *" schedule) it also refreshes the uv.lock of every
# Python image, so dependency-only updates are picked up (--python-deps).
#
# The Python app workflows (ansible.yml, ruff.yml, ...) are deliberately NOT
# push triggers: this run commits to them itself, and with cancel-in-progress
# its own push would cancel it mid-run.
#
name: Update Docker

on:
  push:
    branches: 
      - main
    paths:
      - scripts/updateDockerImages.sh
      - .github/workflows/update-docker.yml
  workflow_dispatch:
    inputs:
      python_deps:
        description: "Also refresh the uv.lock of every Python image"
        type: boolean
        default: true
  schedule:
    - cron: "0 * * * *"
    - cron: "30 3 * * *"

env:
  DOCKER_CLI_EXPERIMENTAL: enabled
  REPOSITORY: ${{ github.repository_owner }}/${{ github.workflow }} 

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  update-docker:
    runs-on: ubuntu-26.04

    steps:
      # checkout with a PAT configured with workflow access to allow the workflow to check changes back in
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: block
          disable-telemetry: true
          allowed-endpoints: >
            aerodent.canonical.com:443
            api.github.com:443
            auth.docker.io:443
            azure.archive.ubuntu.com:80
            dl-cdn.alpinelinux.org:443
            download.docker.com:443
            files.pythonhosted.org:443
            github.com:443
            lpar2rrd.com:443
            objects.githubusercontent.com:443
            pkg-containers.githubusercontent.com:443
            pypi.org:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            registry-1.docker.io:443
            releases.astral.sh:443
            security.ubuntu.com:443
            snowball-client.s3.us-west-2.amazonaws.com:443
            stor2rrd.com:443
            xormon.com:443

      - name: Source checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.UPDATE_SECRET }} 
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          enable-cache: true
#          python-version: 3.14
          cache-dependency-glob: "**/pyproject.toml"

      - name: Setup SSH keys
        env:
          BOT_SSH_PRIVATE_KEY: ${{ secrets.JBOT_SSH_PRIVATE_KEY }}
          BOT_SSH_PUBLIC_KEY: ${{ secrets.JBOT_SSH_PUBLIC_KEY }}
        run: |
          mkdir -m 700 -p ~/.ssh
          echo "$BOT_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          echo "$BOT_SSH_PUBLIC_KEY" > ~/.ssh/id_ed25519.pub
          chmod 600 ~/.ssh/id_ed25519
          chmod 644 ~/.ssh/id_ed25519.pub

      - name: Update dependencies
        env:
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          DISPATCH_PYTHON_DEPS: ${{ inputs.python_deps }}
          # Passed through env, not as an inline expression in the script, so the token
          # never appears in the generated step script.
          PAT: ${{ secrets.UPDATE_SECRET }}
        run: |
          git config --global user.name "Gromit Bot"
          git config --global user.email "gromit-bot@users.noreply.github.com"
          git config --global pull.rebase false
          git config --global user.signingkey ~/.ssh/id_ed25519.pub
          git config --global gpg.format ssh
          git config --global commit.gpgsign true
          args=()
          if [[ "$EVENT_SCHEDULE" == "30 3 * * *" || "$DISPATCH_PYTHON_DEPS" == "true" ]]; then
            args+=(--python-deps)
          fi
          scripts/updateDockerImages.sh "${args[@]}"
          rm -rf ~/.ssh
