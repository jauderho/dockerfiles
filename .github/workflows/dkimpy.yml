name: dkimpy

on:
  push:
    branches:
      - main
    paths:
      - dkimpy/*
      - .github/workflows/dkimpy.yml
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 1"

env:
  BUILD_VERSION: "1.1.8"
  DOCKER_CLI_EXPERIMENTAL: enabled
  REPOSITORY: ${{ github.actor }}/${{ github.workflow }}

permissions: read-all

jobs:
  build:
    # Build each distro/platform pair on its own native runner. The job used to
    # run on an arm runner and emulate amd64 for both variants.
    strategy:
      fail-fast: false
      matrix:
        distro: [ubuntu, alpine]
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            runner: ubuntu-26.04
          - platform: linux/arm64
            runner: ubuntu-26.04-arm
          - distro: alpine
            dockerfile: Dockerfile
          - distro: ubuntu
            dockerfile: Dockerfile.ubuntu
    runs-on: ${{ matrix.runner }}
    permissions:
      packages: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          disable-sudo: true
          egress-policy: block
          disable-telemetry: true
          allowed-endpoints:
            95s5acprodeus1file6.blob.core.windows.net:443
            api.github.com:443
            archive.ubuntu.com:80
            artifactcache.actions.githubusercontent.com:443
            auth.docker.io:443
            dl-cdn.alpinelinux.org:443
            docker-images-prod.6aa30f8b08e16409b46e0173d6de2f56.r2.cloudflarestorage.com:443
            files.pythonhosted.org:443
            ghcr.io:443
            github.com:443
            pkg-containers.githubusercontent.com:443
            ports.ubuntu.com:80
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443
            pypi.org:443
            registry-1.docker.io:443
            security.ubuntu.com:80
            umsah0twc0d25lndsc0j.blob.core.windows.net:443
            www.piwheels.org:443
            zrdfepirv2dm3prdstr08.blob.core.windows.net:443
            zrdfepirv2bn4prdstr02.blob.core.windows.net:443

      - name: Source checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare platform name
        run: |
          platform="${{ matrix.platform }}"
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Setup Buildx
        id: buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Set Docker metadata
        id: docker_meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REPOSITORY }}
          labels: |
            org.opencontainers.image.version=${{ env.BUILD_VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=${{ env.REPOSITORY }}

      - name: GitHub login
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest (${{ matrix.distro }})
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ github.workflow }}
          file: ${{ github.workflow }}/${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          build-args: |
            BUILD_VERSION
          sbom: true
          provenance: true
          labels: ${{ steps.docker_meta.outputs.labels }}
          # Push untagged by digest; the merge job stitches the digests into the
          # tagged manifest lists so :latest is never overwritten per-platform.
          outputs: type=image,name=ghcr.io/${{ env.REPOSITORY }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}

      - name: Export digest
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.distro }}-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    if: ${{ github.event_name != 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        distro: [ubuntu, alpine]
    runs-on: ubuntu-26.04
    permissions:
      packages: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          disable-sudo: true
          egress-policy: block
          disable-telemetry: true
          allowed-endpoints:
            95s5acprodeus1file6.blob.core.windows.net:443
            api.github.com:443
            auth.docker.io:443
            ghcr.io:443
            github.com:443
            pkg-containers.githubusercontent.com:443
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443
            registry-1.docker.io:443
            zrdfepirv2dm3prdstr08.blob.core.windows.net:443
            zrdfepirv2bn4prdstr02.blob.core.windows.net:443

      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.distro }}-*
          merge-multiple: true

      - name: Setup Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: GitHub login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: DockerHub login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Create and push manifest lists (${{ matrix.distro }})
        working-directory: /tmp/digests
        env:
          DISTRO: ${{ matrix.distro }}
        run: |
          for reg in docker.io ghcr.io; do
            tags=( -t "${reg}/${REPOSITORY}:${BUILD_VERSION}-${DISTRO}" )
            # alpine is the default variant, so it also owns the unsuffixed tags
            if [ "${DISTRO}" = "alpine" ]; then
              tags+=( -t "${reg}/${REPOSITORY}:${BUILD_VERSION}" \
                      -t "${reg}/${REPOSITORY}:latest" )
            fi
            docker buildx imagetools create "${tags[@]}" \
              $(printf "ghcr.io/${REPOSITORY}@sha256:%s " *)
          done

      - name: Inspect image
        run: docker buildx imagetools inspect "ghcr.io/${REPOSITORY}:${BUILD_VERSION}-${{ matrix.distro }}"
