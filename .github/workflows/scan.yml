#
# Run a daily scan of Docker images using Trivy, Snyk and Anchore
#
name: Scan
on:
  push:
    paths:
      - .github/workflows/scan.yml
      - scripts/PROGRAMS
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GRYPE_DB_CACHE_DIR: /tmp/grype-db

jobs:
  prepare:
    runs-on: ubuntu-26.04
    outputs:
      programs: ${{ steps.set-programs.outputs.programs }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read list of programs from file
        id: set-programs
        run: echo "programs=$(cat scripts/PROGRAMS | jq -R -s -c 'split("\n") | map(select(length > 0))')" >> $GITHUB_OUTPUT

  # Download the Grype vulnerability DB once and share it with every scan job,
  # instead of each of the matrix jobs downloading its own copy. The DB schema
  # is tied to the Grype version, so this job gets Grype from the same
  # anchore/scan-action as the scan jobs: a scan-action bump moves both together.
  grype-db:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          disable-telemetry: true
          allowed-endpoints: >
            *.blob.core.windows.net:443
            actions-results-receiver-production.githubapp.com:443
            api.github.com:443
            get.anchore.io:443
            github.com:443
            grype.anchore.io:443
            hosted-compute-watchdog-prod-eus-02.githubapp.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            toolbox-data.anchore.io:443

      # Scanning an empty directory installs Grype and downloads the DB into
      # GRYPE_DB_CACHE_DIR; the scan result itself is not used.
      - name: Create an empty directory to scan
        run: mkdir "${RUNNER_TEMP}/empty"

      - name: Download the Grype vulnerability DB
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          path: ${{ runner.temp }}/empty
          fail-build: false
          output-format: table
          output-file: ${{ runner.temp }}/grype-db-warmup.txt

      # The imported DB is about 3.4 GB but compresses roughly 5x, so share a
      # zstd archive rather than the raw files.
      - name: Pack the Grype vulnerability DB
        run: tar -C "${GRYPE_DB_CACHE_DIR}" -I 'zstd -T0 -3' -cf "${RUNNER_TEMP}/grype-db.tar.zst" .

      - name: Share the Grype vulnerability DB
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: grype-db
          path: ${{ runner.temp }}/grype-db.tar.zst
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  scan:
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
    needs: [prepare, grype-db]
    # A failed grype-db job must not skip the scans: each one falls back to
    # downloading its own DB.
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    strategy:
      max-parallel: 25
      fail-fast: false
      matrix:
        image: ${{fromJson(needs.prepare.outputs.programs)}}
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          disable-telemetry: true
          # Union of the endpoints required by both Trivy and Anchore/Grype.
          allowed-endpoints: >
            *.blob.core.windows.net:443
            actions-results-receiver-production.githubapp.com:443
            api.github.com:443
            cdn.fwupd.org:443
            check.trivy.dev:443
            get.anchore.io:443
            get.trivy.dev:443
            ghcr.io:443
            github.com:443
            grype.anchore.io:443
            hosted-compute-watchdog-prod-eus-02.githubapp.com:443
            mirror.gcr.io:443
            objects.githubusercontent.com:443
            pkg-containers.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            toolbox-data.anchore.io:443

      # If the shared DB cannot be fetched or unpacked, Grype updates its own DB
      # as before (see GRYPE_DB_AUTO_UPDATE on the Anchore step).
      - name: Fetch the shared Grype vulnerability DB
        id: grype-db-fetch
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: grype-db
          path: ${{ runner.temp }}/grype-db-archive

      - name: Unpack the shared Grype vulnerability DB
        id: grype-db
        if: ${{ steps.grype-db-fetch.outcome == 'success' }}
        continue-on-error: true
        run: |
          mkdir -p "${GRYPE_DB_CACHE_DIR}"
          tar -C "${GRYPE_DB_CACHE_DIR}" -I zstd -xf "${RUNNER_TEMP}/grype-db-archive/grype-db.tar.zst"
          rm -rf "${RUNNER_TEMP}/grype-db-archive"

      # No checkout: both scanners target a published ghcr.io image, not the repo.

      # Trivy and Anchore are independent, so scan concurrently. Both run to
      # completion even if one fails, so a single tool failure does not mask the other.
      - parallel:
          - name: Run Trivy to check ${{ matrix.image }} Docker image for vulnerabilities
            uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
            with:
              #image-ref: 'docker.io/${{ github.actor }}/${{ matrix.image }}:latest'
              image-ref: 'ghcr.io/${{ github.actor }}/${{ matrix.image }}:latest'
              format: 'sarif'
              output: 'trivy-${{ matrix.image }}.sarif'
              severity: 'HIGH,CRITICAL'
              hide-progress: false

          - name: Run Anchore to check ${{ matrix.image }} Docker image for vulnerabilities
            uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
            id: anchore-scan
            env:
              GRYPE_DB_AUTO_UPDATE: ${{ steps.grype-db.outcome == 'success' && 'false' || 'true' }}
            with:
              #image: 'docker.io/${{ github.actor }}/${{ matrix.image }}:latest'
              image: 'ghcr.io/${{ github.actor }}/${{ matrix.image }}:latest'
              fail-build: false
              severity-cutoff: high

      # The group's implicit wait fails the job if either scan failed, so the
      # uploads need !cancelled() to still publish whichever result exists.
      - parallel:
          - name: Upload Trivy result to GitHub Code Scanning
            if: ${{ !cancelled() && hashFiles(format('trivy-{0}.sarif', matrix.image)) != '' }}
            uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
            with:
              sarif_file: 'trivy-${{ matrix.image }}.sarif'
              category: 'trivy-${{ matrix.image }}'

          - name: Upload Anchore result to GitHub Code Scanning
            if: ${{ !cancelled() && steps.anchore-scan.outputs.sarif != '' }}
            uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
            with:
              sarif_file: ${{ steps.anchore-scan.outputs.sarif }}
              category: 'anchore-${{ matrix.image }}'

