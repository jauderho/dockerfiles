# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://help.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    commit-message:
      prefix: "gha:"
    cooldown:
      default-days: 1

  # Maintain dependencies for Python
  #
  # uv, not pip: every Python image installs from a pyproject.toml + uv.lock
  # pair and no requirements.txt is left in the tree. The manifests live one
  # level down, one per image, so this matches the same glob the docker
  # ecosystem uses rather than the repository root.
  - package-ecosystem: "uv"
    directories:
      - "/*"
    open-pull-requests-limit: 25
    schedule:
      interval: "daily"
    commit-message:
      prefix: "python:"
    cooldown:
      default-days: 1

  # Maintain dependencies for Docker
  - package-ecosystem: "docker"
    directories:
      - "/*"
      - "/templates/*"
    # nginx-distroless/Dockerfile.stable is built FROM nginx stable (even minor
    # version). Dependabot cannot tell stable from mainline and would move it to
    # mainline, so scripts/updateDockerImages.sh owns that file instead: it sets
    # the nginx stable tag and digest, and copies the distroless base line from
    # nginx-distroless/Dockerfile, which Dependabot still updates. Both patterns
    # are listed because the docs say paths are relative to the directory and
    # the changelog says relative to the repository root; it is the only
    # Dockerfile.stable in the repository.
    exclude-paths:
      - "nginx-distroless/Dockerfile.stable"
      - "Dockerfile.stable"
    open-pull-requests-limit: 25
    schedule:
      interval: "daily"
    commit-message:
      prefix: "docker:"
    cooldown:
      default-days: 1
