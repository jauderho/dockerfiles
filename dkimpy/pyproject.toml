[project]
name = "dkimpy-project"
dynamic = ["version"]
description = "Project using dkimpy with ed25519, ARC, and asyncio extras"
authors = [{ name = "Jauder Ho" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.14"
keywords = ["dkim", "dkimpy", "email", "ARC", "asyncio", "ed25519"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent"
]
dependencies = [
  "dkimpy[ed25519,ARC,asyncio]"
]

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

# Floor for the CA bundle if it enters the dependency graph (adds no package).
constraint-dependencies = ["certifi>=2026.10.23"]

[tool.uv.sources]
pypi = { url = "https://pypi.org/simple" }
