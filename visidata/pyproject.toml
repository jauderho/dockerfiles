[project]
name = "visidata-project"
dynamic = ["version"]
description = "Project using visidata, python-dateutil, requests, wcwidth, and lxml"
authors = [{ name = "Jauder Ho" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.14"
keywords = ["visidata", "data", "cli", "python-dateutil", "requests", "lxml"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent"
]
dependencies = [
  "visidata",
  "python-dateutil",
  "requests",
  "wcwidth",
  "lxml"
]

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

# Floor for the CA bundle if it enters the dependency graph (adds no package).
constraint-dependencies = ["certifi>=2026.10.23"]

[tool.uv.sources]
pypi = { url = "https://pypi.org/simple" }
