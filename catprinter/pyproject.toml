[project]
name = "catprinter-project"
dynamic = ["version"]
description = "A script using catprinter, bleak, numpy, and opencv-python"
authors = [{ name = "Jauder Ho" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.13"
keywords = ["catprinter", "bleak", "numpy", "opencv"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent"
]
dependencies = [
  "bleak",
  "numpy",
  #"opencv-python>=4.12.0.88",
  "opencv-python-headless",
  "catprinter @ git+https://github.com/jauderho/catprinter.git#egg=catprinter"
]

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]
# The upstream catprinter package requires the GUI build of OpenCV, which needs
# libGL.so.1. Pulling that into the image drags in Mesa + LLVM (~177MB) for a
# cv2.imshow() preview that can never render in a headless container. Give the
# transitional requirement a marker that matches nothing so it is dropped, and
# depend on opencv-python-headless above instead - same cv2 API, no GL.
override-dependencies = ["opencv-python ; sys_platform == 'headless-only'"]

[tool.uv.sources]
pypi = { url = "https://pypi.org/simple" }
